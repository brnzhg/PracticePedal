name: Build CAD
on:
  push:
    paths: ["pedal_cad/**", "pyproject.toml", "uv.lock", ".github/workflows/cad.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach files to a release on a tag push
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # builds every part, runs the fit checks (fails the job if one fails), exports STL/STEP
      - run: uv run --no-dev python -m pedal_cad.build --no-draw
      - uses: actions/upload-artifact@v4
        with:
          name: practice-pedal-cad
          path: |
            out/stl/
            out/step/
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out
          zip -r ../practice-pedal-stl.zip stl
          zip -r ../practice-pedal-step.zip step
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            practice-pedal-stl.zip
            practice-pedal-step.zip
