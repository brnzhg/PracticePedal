 x="243.0" y="605.5" width="105.0" height="105.0" rx="1.5" fill="#fff" stroke="#333" stroke-width="1.2" /><text x="295.5" y="735.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#9b3fc4" dominant-baseline="middle">RIGHT pedal switch</text><path d="M295.5,616.7 L295.5,548.8 L466.2,548.8 L466.2,202.1 L518.7,202.1" fill="none" stroke="#9b3fc4" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="295.5" cy="616.7" r="4" fill="#9b3fc4" stroke="#111" stroke-width="0.8"/><circle cx="260.5" cy="631.4" r="4" fill="#222" stroke="#111" stroke-width="0.8"/><path d="M813.5,631.4 L813.5,584.5" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M537.0,631.4 L537.0,584.5" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M260.5,631.4 L260.5,584.5" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M813.5,584.5 L260.5,584.5" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M445.2,584.5 L445.2,148.8 L518.7,148.8" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M708.5,219.1 L694.5,219.1 L694.5,154.3 L852.0,154.3 L852.0,140.3" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M834.5,140.3 L834.5,171.8 L649.8,171.8 L649.8,95.4 L625.3,95.4" fill="none" stroke="#e76f51" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M708.5,235.9 L637.9,235.9 L637.9,113.2 L625.3,113.2" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="708.5" cy="219.1" r="3.2" fill="#d62828" stroke="#111" stroke-width="0.8"/><circle cx="708.5" cy="235.9" r="3.2" fill="#222" stroke="#111" stroke-width="0.8"/><circle cx="852.0" cy="140.3" r="3.2" fill="#d62828" stroke="#111" stroke-width="0.8"/><circle cx="834.5" cy="140.3" r="3.2" fill="#e76f51" stroke="#111" stroke-width="0.8"/><text x="572.0" y="24.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" dominant-baseline="middle">REAR EDGE (USB and power switch poke out here)</text><text x="572.0" y="778.8" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" dominant-baseline="middle">FRONT EDGE (toe end of the pedals)</text><text x="1134.0" y="76" font-size="16" font-weight="bold">Wiring</text><line x1="1134.0" y1="106" x2="1168.0" y2="106" stroke="#2a9d4b" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="106" font-size="13" dominant-baseline="middle">Left pedal switch  →  D2</text><line x1="1134.0" y1="134" x2="1168.0" y2="134" stroke="#1f6fd1" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="134" font-size="13" dominant-baseline="middle">Centre switch  →  D3</text><line x1="1134.0" y1="162" x2="1168.0" y2="162" stroke="#9b3fc4" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="162" font-size="13" dominant-baseline="middle">Right pedal switch  →  D4</text><line x1="1134.0" y1="190" x2="1168.0" y2="190" stroke="#222" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="190" font-size="13" dominant-baseline="middle">Other pin of every switch  →  GND</text><line x1="1134.0" y1="218" x2="1168.0" y2="218" stroke="#d62828" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="218" font-size="13" dominant-baseline="middle">Battery +  →  power switch centre pin</text><line x1="1134.0" y1="246" x2="1168.0" y2="246" stroke="#e76f51" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="246" font-size="13" dominant-baseline="middle">Power switch outer pin  →  B+</text><line x1="1134.0" y1="274" x2="1168.0" y2="274" stroke="#222" stroke-width="4" stroke-linecap="round"/><text x="1178.0" y="274" font-size="13" dominant-baseline="middle">Battery −  →  B− (GND)</text><text x="1134.0" y="320" font-size="12.5" fill="#444">You are looking at the UNDERSIDE of the sled,</text><text x="1134.0" y="339" font-size="12.5" fill="#444">the way it sits on the bench while you solder.</text><text x="1134.0" y="358" font-size="12.5" fill="#444">Left and right are mirrored: the LEFT pedal's</text><text x="1134.0" y="377" font-size="12.5" fill="#444">switch is on the RIGHT of this picture.</text><text x="1134.0" y="396" font-size="12.5" fill="#444"></text><text x="1134.0" y="415" font-size="12.5" fill="#444">The nice!nano lies parts-side up (towards you),</text><text x="1134.0" y="434" font-size="12.5" fill="#444">USB-C to the rear edge.</text><text x="1134.0" y="453" font-size="12.5" fill="#444"></text><text x="1134.0" y="472" font-size="12.5" fill="#444">Either pin of a key switch can be the signal one.</text><text x="1134.0" y="491" font-size="12.5" fill="#444">Wire routes are a suggestion; pin positions on</text><text x="1134.0" y="510" font-size="12.5" fill="#444">the nice!nano are drawn to scale.</text></svg>