<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="810" viewBox="0 0 1464 810" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><rect x="58.6" y="88.5" width="1026.9" height="658.7" rx="10" fill="#f6efe4" stroke="#8a7a63" stroke-width="1.2" /><rect x="72.6" y="546.0" width="998.9" height="49.0" rx="1" fill="#ece2d2" stroke="none" stroke-width="1.2" /><text x="1057.4" y="535.5" font-size="11" text-anchor="end" font-weight="normal" fill="#8a7a63" dominant-baseline="middle">wire channel (notches in the ribs)</text><rect x="715.5" y="173.2" width="350.0" height="238.0" rx="4" fill="#cfe3f7" stroke="#2f6ea8" stroke-width="1.2" /><text x="890.5" y="271.2" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f6ea8" dominant-baseline="middle">BATTERY</text><text x="890.5" y="302.8" font-size="12" text-anchor="middle" font-weight="normal" fill="#2f6ea8" dominant-baseline="middle">LiPo in its pocket, leads exit</text><text x="890.5" y="320.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#2f6ea8" dominant-baseline="middle">towards the nice!nano</text><rect x="821.9" y="73.1" width="60.2" height="67.2" rx="1" fill="#e0e0e0" stroke="#555" stroke-width="1.2" /><text x="892.6" y="106.8" font-size="12" text-anchor="start" font-weight="bold" fill="#111" dominant-baseline="middle">power switch</text><rect x="507.9" y="77.7" width="128.1" height="231.0" rx="2" fill="#2e2e4f" stroke="#111" stroke-width="1.2" /><rect x="540.7" y="70.0" width="62.6" height="51.1" rx="1" fill="#b8b8b8" stroke="#555" stroke-width="1.2" /><text x="572.0" y="49.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111" dominant-baseline="middle">USB-C</text><circle cx="518.7" cy="95.4" r="5" fill="#8a7d4a" stroke="#111" stroke-width="0.6"/><circle cx="518.7" cy="113.2" r="5" fill="#8a7d4a" stroke="#111" stroke-width="0.6"/><circle cx="518.7" cy="131.0" r="5" fill="#8a7d4a" stroke="#111" stroke-width="0.6"/><circle cx="51